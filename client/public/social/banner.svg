<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="RobinBot banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#051105"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00c805" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="85%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00c805" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feather" x1="15%" y1="95%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="#008803"/>
      <stop offset="45%" stop-color="#00c805"/>
      <stop offset="100%" stop-color="#7ee04a"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00c805" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00c805" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glowL)"/>
  <rect width="1500" height="500" fill="url(#glowR)"/>

  <path d="M0 420 L120 380 L260 395 L400 340 L560 360 L720 290 L900 310 L1080 250 L1260 270 L1500 220 L1500 500 L0 500 Z" fill="url(#chartFill)"/>
  <path d="M0 420 L120 380 L260 395 L400 340 L560 360 L720 290 L900 310 L1080 250 L1260 270 L1500 220" fill="none" stroke="#00c805" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <g transform="translate(72, 86) scale(2.65)">
    <rect width="128" height="128" rx="28" fill="#000"/>
    <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#00c805" stroke-width="2" opacity="0.35"/>
    <ellipse cx="64" cy="72" rx="46" ry="38" fill="#00c805" opacity="0.06"/>
    <g filter="url(#softGlow)">
      <path fill="url(#feather)" d="M36 104 C30 88 28 68 34 50 C40 32 52 18 66 10 C74 6 82 5 88 8 C82 10 76 14 70 22 C58 38 50 58 46 76 C43 90 40 100 36 104 Z"/>
      <path fill="none" stroke="#b8f5a0" stroke-width="1.6" stroke-linecap="round" opacity="0.5" d="M44 84 L62 76 M42 68 L62 60 M40 52 L58 44"/>
    </g>
    <g transform="translate(54, 44)">
      <rect width="56" height="48" rx="14" fill="#080808" stroke="#00c805" stroke-width="2.5"/>
      <rect x="6" y="6" width="44" height="32" rx="10" fill="#0f0f0f"/>
      <circle cx="20" cy="22" r="6" fill="#00c805"/>
      <circle cx="36" cy="22" r="6" fill="#00c805"/>
      <path d="M18 32 Q28 38 38 32" fill="none" stroke="#5ac53a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M28 -2 V-10" stroke="#00c805" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="28" cy="-12" r="3.5" fill="#00c805"/>
    </g>
    <path d="M98 92 V68 L108 68" fill="none" stroke="#00c805" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RobinBot wordmark -->
  <text x="480" y="215" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="108" font-weight="800" letter-spacing="-3">
    <tspan fill="#00c805">Robin</tspan><tspan fill="#ffffff">Bot</tspan>
  </text>
  <text x="482" y="272" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="600" fill="#8a9a8a" letter-spacing="0.5">
    Robinhood Chain ? Tokenized Stocks ? Uniswap V4 ? 24/7
  </text>
  <text x="482" y="322" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="500" fill="#5ac53a">
    Automated RWA stock-token bots ? sign up, fund, run.
  </text>

  <rect x="482" y="354" width="230" height="44" rx="22" fill="#00c805" fill-opacity="0.12" stroke="#00c805" stroke-opacity="0.45"/>
  <text x="597" y="383" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#00c805">robinbot.app</text>

  <g transform="translate(1280, 80)" opacity="0.9">
    <circle cx="0" cy="0" r="36" fill="#00c805" opacity="0.1"/>
    <path d="M-18 6 A24 24 0 1 1 18 6 A18 18 0 1 0 -18 6" fill="#00c805"/>
  </g>
  <path d="M1340 380 V300 L1390 300" fill="none" stroke="#00c805" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <rect x="0" y="0" width="1500" height="4" fill="#00c805"/>
</svg>
