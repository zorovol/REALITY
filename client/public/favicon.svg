  <circle cx="18.5" cy="11" r="1.1" fill="#34d399"/>
  <path d="M13 14.5h6" stroke="#22d3ee" stroke-width="1" stroke-linecap="round"/>
  <path d="M16 5.5v2.2M12.2 6.8l1.2 1.9M19.8 6.8l-1.2 1.9" stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
