<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RobinhoodBot">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="feather" x1="15%" y1="95%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="#008803"/>
      <stop offset="45%" stop-color="#00c805"/>
      <stop offset="100%" stop-color="#7ee04a"/>
    </linearGradient>
    <linearGradient id="featherShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00c805" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c805" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00c805" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5ac53a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="botShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#00c805" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App canvas -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#ring)" stroke-width="1.5"/>

  <!-- Ambient glow -->
  <ellipse cx="64" cy="72" rx="46" ry="38" fill="#00c805" opacity="0.06"/>

  <!-- Chart area fill -->
  <path
    d="M14 96 L28 82 L42 86 L56 72 L72 76 L88 58 L104 62 L104 96 Z"
    fill="url(#chartFill)"
  />

  <!-- Chart line -->
  <path
    d="M14 96 L28 82 L42 86 L56 72 L72 76 L88 58 L104 62"
    fill="none"
    stroke="#00c805"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  />

  <!-- Feather — bold Robinhood-inspired quill -->
  <g filter="url(#softGlow)">
    <path
      fill="url(#feather)"
      d="M36 104
         C30 88 28 68 34 50
         C40 32 52 18 66 10
         C74 6 82 5 88 8
         C82 10 76 14 70 22
         C58 38 50 58 46 76
         C43 90 40 100 36 104 Z"
    />
    <path
      fill="url(#featherShine)"
      d="M36 104
         C30 88 28 68 34 50
         C40 32 52 18 66 10
         C74 6 82 5 88 8
         C82 10 76 14 70 22
         C58 38 50 58 46 76
         C43 90 40 100 36 104 Z"
    />
    <!-- spine -->
    <path
      fill="none"
      stroke="#004400"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.4"
      d="M38 102 C44 78 54 52 68 28 C74 20 80 14 86 10"
    />
    <!-- barbs -->
    <path fill="none" stroke="#b8f5a0" stroke-width="1.6" stroke-linecap="round" opacity="0.5"
      d="M44 84 L62 76 M42 68 L62 60 M40 52 L58 44"/>
  </g>

  <!-- Bot head -->
  <g filter="url(#botShadow)" transform="translate(54, 44)">
    <!-- body -->
    <rect x="0" y="0" width="56" height="48" rx="14" fill="#080808" stroke="#00c805" stroke-width="2.5"/>
    <!-- face plate -->
    <rect x="6" y="6" width="44" height="32" rx="10" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="1"/>
    <!-- eyes -->
    <circle cx="20" cy="22" r="6" fill="#00c805"/>
    <circle cx="36" cy="22" r="6" fill="#00c805"/>
    <circle cx="22" cy="20" r="2" fill="#e8ffe8"/>
    <circle cx="38" cy="20" r="2" fill="#e8ffe8"/>
    <!-- smile -->
    <path d="M18 32 Q28 38 38 32" fill="none" stroke="#5ac53a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- antenna -->
    <path d="M28 -2 V-10" stroke="#00c805" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="-12" r="3.5" fill="#00c805"/>
    <circle cx="28" cy="-12" r="1.5" fill="#e8ffe8"/>
  </g>

  <!-- Memecoin moon accent -->
  <g transform="translate(92, 18)">
    <circle cx="0" cy="0" r="10" fill="#00c805" opacity="0.12"/>
    <path
      d="M-6 2 A8 8 0 1 1 6 2 A6 6 0 1 0 -6 2"
      fill="#00c805"
      opacity="0.9"
    />
    <circle cx="4" cy="-3" r="1.5" fill="#7ee04a"/>
  </g>

  <!-- Up arrow tick -->
  <path
    d="M98 92 V68 L108 68"
    fill="none"
    stroke="#00c805"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
