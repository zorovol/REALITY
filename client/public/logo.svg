<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="RobinhoodBot">
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a004"/>
      <stop offset="100%" stop-color="#00c805"/>
    </linearGradient>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#000000"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#00c805" stroke-width="2" opacity="0.35"/>
  <!-- upward chart -->
  <path d="M24 88 L44 72 L58 78 L76 52 L96 60 L104 44" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)"/>
  <circle cx="104" cy="44" r="5" fill="#00c805"/>
  <!-- bot head -->
  <rect x="40" y="36" width="48" height="40" rx="12" fill="#0a0a0a" stroke="#00c805" stroke-width="2.5"/>
  <circle cx="52" cy="52" r="4.5" fill="#00c805"/>
  <circle cx="76" cy="52" r="4.5" fill="#00c805"/>
  <path d="M52 64 h24" stroke="#5ac53a" stroke-width="3" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M64 36 V26 M64 26 L58 20 M64 26 L70 20" stroke="#00c805" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gear hint -->
  <circle cx="96" cy="96" r="10" fill="none" stroke="#00c805" stroke-width="2" opacity="0.6"/>
  <circle cx="96" cy="96" r="3" fill="#00c805" opacity="0.8"/>
</svg>
