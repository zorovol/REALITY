# Backend for real trading + websockets (Vercel hosts the static UI only).
# Deploy at https://dashboard.render.com → New → Blueprint → connect this repo.
services:
  - type: web
    name: ai-drama-island-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://gptgrokgeminideepseekfable.com,https://www.gptgrokgeminideepseekfable.com,https://ai-drama-island.vercel.app
      - key: SIMULATION_FALLBACK
        value: "false"
      - key: PUMP_DISCOVERY
        value: "true"
      - key: PUMP_AUTO_LAUNCH
        value: "false"
      - key: TRADE_USD_PER_SIDE
        value: "2"
      - key: TRADE_INTERVAL_MS
        value: "2000"
      - key: MAX_TRADES_PER_MINUTE
        value: "30"
      - key: BALANCE_REFRESH_MS
        value: "5000"
      - key: TRADE_SELL_AFTER_BUY_MS
        value: "20000"
      - key: MIN_SOL_FOR_TRADE
        value: "0.02"
      - key: PUMP_TARGET_MCAP_USD
        value: "4000"
      - key: PUMP_MCAP_MIN_USD
        value: "2500"
      - key: PUMP_MCAP_MAX_USD
        value: "6000"
      - key: ENCRYPTION_KEY
        sync: false
      - key: WALLETS_ENC_B64
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_NETWORK
        value: mainnet-beta
      - key: DATABASE_URL
        sync: false
