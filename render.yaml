# Backend for RobinBot trading + websockets (Vercel hosts the static UI).
# Render dashboard → Blueprint → connect repo, OR set env vars manually on ai-drama-island-api.
#
# DATABASE_URL: use Neon (recommended) OR the Render Postgres database below.
# After adding DATABASE_URL, redeploy — /api/health should show db: "postgres".

databases:
  - name: robinhoodbot-db
    plan: free
    region: oregon
    databaseName: robinhoodbot
    user: robinhoodbot

services:
  - type: web
    name: ai-drama-island-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://robinbot.app,https://www.robinbot.app,https://botsforge.tech,https://www.botsforge.tech,https://ai-drama-island.vercel.app
      - key: SIMULATION_FALLBACK
        value: "false"
      - key: AUTH_SERVER_KEY
        sync: false
      # Neon: paste postgresql://...?sslmode=require from console.neon.tech
      # Render Postgres: auto-wired if you deploy this blueprint with the database above
      - key: DATABASE_URL
        fromDatabase:
          name: robinhoodbot-db
          property: connectionString
      # Robinhood Chain
      - key: CHAIN_NETWORK
        value: mainnet
      - key: EVM_RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      - key: CHAIN_ID
        value: "4663"
      - key: CHAIN_EXPLORER_URL
        value: https://robinhoodchain.blockscout.com
      - key: NATIVE_SYMBOL
        value: ETH
      - key: WETH_ADDRESS
        value: 0x0Bd7D308f8E1639FAb988df18A8011f41EAcAD73
      - key: UNISWAP_V2_ROUTER
        value: 0x89e5DB8B5aA49aA85AC63f691524311AEB649eba
      - key: MEMECOIN_DISCOVERY_REFRESH_MS
        value: "45000"
      - key: MEMECOIN_MIN_LIQUIDITY_USD
        value: "500"
      - key: ENABLE_SOLANA_ISLAND
        value: "false"
